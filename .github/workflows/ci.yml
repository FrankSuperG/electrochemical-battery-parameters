name: Verify catalog and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYBAMM_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ebp validate
      - run: python scripts/build_data_index.py --check
      - run: python -m pytest -q
      - run: ebp build-site
      - run: python -m build
      - run: python scripts/verify_distribution.py
  provenance-and-adapter:
    runs-on: ubuntu-latest
    env:
      PYBAMM_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,pybamm]'
      # ORA returns HTTP 403 to hosted runners. These attributed release copies
      # are verified against the primary-source SHA-256 pins by the importer.
      - name: Restore pinned Oxford source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/upstream
          gh release download upstream-lfp-v0.2.0 --repo "$GITHUB_REPOSITORY" \
            --dir .cache/upstream --pattern lin-full-discharge.mat \
            --pattern lin-readme.txt
      - run: python scripts/seed_v01.py --download
      - run: git diff --exit-code -- src/ebp/data
      - run: python -m pytest -q
      - run: python examples/pybamm_ocp.py
